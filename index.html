B0\u1EE3c c\u1EA5u t\u1EA1o t\u1EEB nh\u1EEFng lo\u1EA1i h\u1EA1t n\xE0o?",options:["Proton v\xE0 electron","Proton v\xE0 neutron","Neutron v\xE0 electron","Ch\u1EC9 c\xF3 proton"],correctIndex:1,sampleAnswer:"Proton v\xE0 neutron",explanation:"H\u1EA1t nh\xE2n n\u1EB1m \u1EDF t\xE2m nguy\xEAn t\u1EED g\u1ED3m proton (+) v\xE0 neutron (kh\xF4ng mang \u0111i\u1EC7n); electron chuy\u1EC3n \u0111\u1ED9ng \u1EDF l\u1EDBp v\u1ECF."},{id:"h10-b1-q2",type:"mcq",prompt:"Nguy\xEAn t\u1EED Sodium (Na) c\xF3 Z = 11 v\xE0 s\u1ED1 kh\u1ED1i A = 23. S\u1ED1 h\u1EA1t neutron trong h\u1EA1t nh\xE2n Na l\xE0:",options:["11","12","23","34"],correctIndex:1,sampleAnswer:"12",explanation:"N = A - Z = 23 - 11 = 12 h\u1EA1t neutron."},{id:"h10-b1-q3",type:"mcq",prompt:"Trong t\u1EF1 nhi\xEAn, Chlorine c\xF3 2 \u0111\u1ED3ng v\u1ECB b\u1EC1n l\xE0 \xB3\u2075Cl (75%) v\xE0 \xB3\u2077Cl (25%). Nguy\xEAn t\u1EED kh\u1ED1i trung b\xECnh c\u1EE7a Cl l\xE0:",options:["35.2","35.5","36.0","36.5"],correctIndex:1,sampleAnswer:"35.5",explanation:"A\u0304 = (35 \xD7 75 + 37 \xD7 25) / 100 = 35.5."},{id:"h10-b1-q4",type:"essay",prompt:"T\u1ED5ng s\u1ED1 h\u1EA1t c\u01A1 b\u1EA3n (p, n, e) trong nguy\xEAn t\u1EED X l\xE0 40, trong \u0111\xF3 s\u1ED1 h\u1EA1t mang \u0111i\u1EC7n nhi\u1EC1u h\u01A1n s\u1ED1 h\u1EA1t kh\xF4ng mang \u0111i\u1EC7n l\xE0 12. T\xEDnh Z v\xE0 vi\u1EBFt k\xFD hi\u1EC7u nguy\xEAn t\u1EED X.",expectedKeywords:["13","14","27","al"],sampleAnswer:"2Z + N = 40 v\xE0 2Z - N = 12 => Z = 13, N = 14, A = 27. Nguy\xEAn t\u1ED1 X l\xE0 Nh\xF4m (\xB2\u2077\u2081\u2083Al).",explanation:"Gi\u1EA3i h\u1EC7: 4Z = 52 => Z = 13 (Al), N = 40 - 26 = 14, s\u1ED1 kh\u1ED1i A = 13 + 14 = 27."}]},{id:"h10-b2",grade:10,chapter:"Ch\u01B0\u01A1ng 1: C\u1EA5u t\u1EA1o nguy\xEAn t\u1EED",title:"B\xE0i 3\u20134: M\xF4 h\xECnh nguy\xEAn t\u1EED, Orbital & C\u1EA5u h\xECnh electron",summary:"Electron chuy\u1EC3n \u0111\u1ED9ng trong v\xF9ng kh\xF4ng gian g\u1ECDi l\xE0 orbital nguy\xEAn t\u1EED (AO): s (h\xECnh c\u1EA7u, 1 AO), p (h\xECnh s\u1ED1 8 n\u1ED5i, 3 AO), d (5 AO), f (7 AO). Ph\xE2n b\u1ED1 electron tu\xE2n theo 3 nguy\xEAn l\xFD/quy t\u1EAFc: V\u1EEFng b\u1EC1n, Pauli (t\u1ED1i \u0111a 2e spin ng\u01B0\u1EE3c nhau/AO) v\xE0 Hund (\u0111i\u1EC1n t\u1ED1i \u0111a e \u0111\u1ED9c th\xE2n).",keyFormulas:["S\u1ED1 e t\u1ED1i \u0111a l\u1EDBp n = 2n\xB2","Th\u1EE9 t\u1EF1 m\u1EE9c n\u0103ng l\u01B0\u1EE3ng: 1s 2s 2p 3s 3p 4s 3d 4p..."],questions:[{id:"h10-b2-q1",type:"mcq",prompt:"S\u1ED1 electron t\u1ED1i \u0111a ch\u1EE9a trong ph\xE2n l\u1EDBp p l\xE0 bao nhi\xEAu?",options:["2","6","10","14"],correctIndex:1,sampleAnswer:"6",explanation:"Ph\xE2n l\u1EDBp p c\xF3 3 orbital (px, py, pz), m\u1ED7i AO t\u1ED1i \u0111a 2 electron n\xEAn ch\u1EE9a t\u1ED1i \u0111a 3 \xD7 2 = 6 electron."},{id:"h10-b2-q2",type:"mcq",prompt:"C\u1EA5u h\xECnh electron n\xE0o sau \u0111\xE2y vi\u1EBFt \u0111\xFAng cho nguy\xEAn t\u1EED Fe (Z = 26)?",options:["[Ar] 3d\u2078","[Ar] 4s\xB2 3d\u2076","[Ar] 3d\u2076 4s\xB2","[Ar] 3d\u2075 4s\xB2"],correctIndex:2,sampleAnswer:"[Ar] 3d\u2076 4s\xB2",explanation:"\u0110i\u1EC1n theo m\u1EE9c n\u0103ng l\u01B0\u1EE3ng: 1s\xB2 2s\xB2 2p\u2076 3s\xB2 3p\u2076 4s\xB2 3d\u2076, sau \u0111\xF3 s\u1EAFp x\u1EBFp theo th\u1EE9 t\u1EF1 l\u1EDBp: [Ar] 3d\u2076 4s\xB2."},{id:"h10-b2-q3",type:"mcq",prompt:"S\u1ED1 electron l\u1EDBp ngo\xE0i c\xF9ng quy\u1EBFt \u0111\u1ECBnh t\xEDnh ch\u1EA5t h\xF3a h\u1ECDc c\u01A1 b\u1EA3n. Nguy\xEAn t\u1EED c\xF3 1, 2, 3 electron l\u1EDBp ngo\xE0i c\xF9ng th\u01B0\u1EDDng l\xE0:",options:["Phi kim","Kh\xED hi\u1EBFm","Kim lo\u1EA1i (tr\u1EEB H, He, B)","Halogen"],correctIndex:2,sampleAnswer:"Kim lo\u1EA1i (tr\u1EEB H, He, B)",explanation:"Nguy\xEAn t\u1EED c\xF3 1, 2, 3e ngo\xE0i c\xF9ng d\u1EC5 nh\u01B0\u1EDDng electron \u0111\u1EC3 \u0111\u1EA1t c\u1EA5u h\xECnh b\u1EC1n kh\xED hi\u1EBFm n\xEAn th\u1EC3 hi\u1EC7n t\xEDnh kim lo\u1EA1i."},{id:"h10-b2-q4",type:"essay",prompt:"Vi\u1EBFt c\u1EA5u h\xECnh electron \u0111\u1EA7y \u0111\u1EE7 c\u1EE7a nguy\xEAn t\u1EED Cr (Z = 24) v\xE0 gi\u1EA3i th\xEDch v\xEC sao c\u1EA5u h\xECnh c\u1EE7a Cr l\u1EA1i c\xF3 s\u1EF1 chuy\u1EC3n 1e t\u1EEB 4s sang 3d.",expectedKeywords:["1s2","3d5","4s1","b\xE1n b\xE3o h\xF2a"],sampleAnswer:"1s\xB2 2s\xB2 2p\u2076 3s\xB2 3p\u2076 3d\u2075 4s\xB9 ([Ar] 3d\u2075 4s\xB9). V\xEC tr\u1EA1ng th\xE1i 3d\u2075 (b\xE1n b\xE3o h\xF2a) b\u1EC1n v\u1EEFng v\u1EC1 m\u1EB7t n\u0103ng l\u01B0\u1EE3ng h\u01A1n 3d\u2074 4s\xB2.",explanation:"Ph\xE2n l\u1EDBp d c\xF3 5 orbital; khi m\u1ED7i orbital \u0111\u1EC1u c\xF3 1e (3d\u2075) t\u1EA1o \u0111\u1ED1i x\u1EE9ng c\u1EA7u c\xF3 n\u0103ng l\u01B0\u1EE3ng th\u1EA5p v\xE0 b\u1EC1n h\u01A1n."}]},{id:"h10-b3",grade:10,chapter:"Ch\u01B0\u01A1ng 2: B\u1EA3ng tu\u1EA7n ho\xE0n c\xE1c nguy\xEAn t\u1ED1 h\xF3a h\u1ECDc",title:"B\xE0i 5\u20137: C\u1EA5u t\u1EA1o b\u1EA3ng tu\u1EA7n ho\xE0n & Xu h\u01B0\u1EDBng bi\u1EBFn \u0111\u1ED5i tu\u1EA7n ho\xE0n",summary:"S\u1ED1 th\u1EE9 t\u1EF1 \xF4 = Z; S\u1ED1 th\u1EE9 t\u1EF1 chu k\xEC = s\u1ED1 l\u1EDBp electron; S\u1ED1 th\u1EE9 t\u1EF1 nh\xF3m A = s\u1ED1 electron l\u1EDBp ngo\xE0i c\xF9ng. Trong m\u1ED9t chu k\xEC (tr\xE1i -> ph\u1EA3i): b\xE1n k\xEDnh gi\u1EA3m, \u0111\u1ED9 \xE2m \u0111i\u1EC7n & t\xEDnh phi kim t\u0103ng, t\xEDnh kim lo\u1EA1i gi\u1EA3m. Trong m\u1ED9t nh\xF3m A (tr\xEAn -> d\u01B0\u1EDBi): b\xE1n k\xEDnh & t\xEDnh kim lo\u1EA1i t\u0103ng, \u0111\u1ED9 \xE2m \u0111i\u1EC7n & t\xEDnh phi kim gi\u1EA3m.",keyFormulas:["STT Chu k\xEC = S\u1ED1 l\u1EDBp e","STT Nh\xF3m A = S\u1ED1 e l\u1EDBp ngo\xE0i c\xF9ng","H\xF3a tr\u1ECB cao nh\u1EA5t v\u1EDBi O = STT nh\xF3m A"],questions:[{id:"h10-b3-q1",type:"mcq",prompt:"Nguy\xEAn t\u1ED1 X c\xF3 c\u1EA5u h\xECnh electron 1s\xB2 2s\xB2 2p\u2076 3s\xB2 3p\u2074. V\u1ECB tr\xED c\u1EE7a X trong b\u1EA3ng tu\u1EA7n ho\xE0n l\xE0:",options:["Chu k\xEC 3, nh\xF3m IVA","Chu k\xEC 3, nh\xF3m VIA","Chu k\xEC 4, nh\xF3m IIIA","Chu k\xEC 2, nh\xF3m VIA"],correctIndex:1,sampleAnswer:"Chu k\xEC 3, nh\xF3m VIA",explanation:"C\xF3 3 l\u1EDBp electron -> chu k\xEC 3; l\u1EDBp ngo\xE0i c\xF9ng 3s\xB23p\u2074 c\xF3 6e v\xE0 l\xE0 nguy\xEAn t\u1ED1 p -> nh\xF3m VIA (L\u01B0u hu\u1EF3nh)."},{id:"h10-b3-q2",type:"mcq",prompt:"D\xE3y nguy\xEAn t\u1ED1 n\xE0o sau \u0111\xE2y \u0111\u01B0\u1EE3c x\u1EBFp theo chi\u1EC1u T\u0102NG D\u1EA6N \u0111\u1ED9 \xE2m \u0111i\u1EC7n?",options:["F < O < N < C","Na < Mg < Al < Si","I < Br < F < Cl","K < Na < Mg < Li"],correctIndex:1,sampleAnswer:"Na < Mg < Al < Si",explanation:"Trong chu k\xEC 3 \u0111i t\u1EEB tr\xE1i sang ph\u1EA3i (Na -> Mg -> Al -> Si), b\xE1n k\xEDnh gi\u1EA3m v\xE0 l\u1EF1c h\xFAt h\u1EA1t nh\xE2n t\u0103ng n\xEAn \u0111\u1ED9 \xE2m \u0111i\u1EC7n t\u0103ng d\u1EA7n."},{id:"h10-b3-q3",type:"essay",prompt:"Nguy\xEAn t\u1ED1 R thu\u1ED9c nh\xF3m VA. Vi\u1EBFt c\xF4ng th\u1EE9c oxide cao nh\u1EA5t v\xE0 h\u1EE3p ch\u1EA5t kh\xED v\u1EDBi hydrogen c\u1EE7a R.",expectedKeywords:["r2o5","rh3"],sampleAnswer:"Oxide cao nh\u1EA5t: R\u2082O\u2085 (h\xF3a tr\u1ECB V); H\u1EE3p ch\u1EA5t kh\xED v\u1EDBi H: RH\u2083 (h\xF3a tr\u1ECB 8 - 5 = III).",explanation:"T\u1ED5ng h\xF3a tr\u1ECB cao nh\u1EA5t v\u1EDBi oxygen v\xE0 h\xF3a tr\u1ECB trong h\u1EE3p ch\u1EA5t kh\xED v\u1EDBi hydrogen c\u1EE7a phi kim lu\xF4n b\u1EB1ng 8."}]},{id:"h10-b4",grade:10,chapter:"Ch\u01B0\u01A1ng 3\u20134: Li\xEAn k\u1EBFt h\xF3a h\u1ECDc & Ph\u1EA3n \u1EE9ng oxi h\xF3a - kh\u1EED",title:"B\xE0i 9\u201315: Li\xEAn k\u1EBFt ion, C\u1ED9ng h\xF3a tr\u1ECB & C\xE2n b\u1EB1ng oxi h\xF3a - kh\u1EED",summary:'Li\xEAn k\u1EBFt ion h\xECnh th\xE0nh do l\u1EF1c h\xFAt t\u0129nh \u0111i\u1EC7n gi\u1EEFa cation v\xE0 anion (\u0394\u03C7 \u2265 1.7). Li\xEAn k\u1EBFt c\u1ED9ng h\xF3a tr\u1ECB h\xECnh th\xE0nh b\u1EB1ng s\u1EF1 d\xF9ng chung c\u1EB7p electron. Ph\u1EA3n \u1EE9ng oxi h\xF3a - kh\u1EED c\xF3 s\u1EF1 thay \u0111\u1ED5i s\u1ED1 oxi h\xF3a: "Kh\u1EED cho - O nh\u1EADn" v\xE0 c\xE2n b\u1EB1ng theo ph\u01B0\u01A1ng ph\xE1p th\u0103ng b\u1EB1ng electron.',keyFormulas:["\u0394\u03C7 \u2265 1.7: Li\xEAn k\u1EBFt ion","0 \u2264 \u0394\u03C7 < 0.4: CHT kh\xF4ng c\u1EF1c","\u2211e nh\u01B0\u1EDDng = \u2211e nh\u1EADn"],questions:[{id:"h10-b4-q1",type:"mcq",prompt:"S\u1ED1 oxi h\xF3a c\u1EE7a nguy\xEAn t\u1ED1 Mn trong ion MnO\u2084\u207B v\xE0 Cr trong Cr\u2082O\u2087\xB2\u207B l\u1EA7n l\u01B0\u1EE3t l\xE0:",options:["+6 v\xE0 +6","+7 v\xE0 +6","+7 v\xE0 +3","+5 v\xE0 +6"],correctIndex:1,sampleAnswer:"+7 v\xE0 +6",explanation:"Trong MnO\u2084\u207B: x + 4(-2) = -1 => x = +7. Trong Cr\u2082O\u2087\xB2\u207B: 2y + 7(-2) = -2 => y = +6."},{id:"h10-b4-q2",type:"mcq",prompt:"Cho ph\u1EA3n \u1EE9ng: aCu + bHNO\u2083 \u2192 cCu(NO\u2083)\u2082 + dNO + eH\u2082O. T\u1ED5ng h\u1EC7 s\u1ED1 c\xE2n b\u1EB1ng t\u1ED1i gi\u1EA3n (a + b) l\xE0:",options:["8","10","11","14"],correctIndex:2,sampleAnswer:"11",explanation:"Ph\u01B0\u01A1ng tr\xECnh c\xE2n b\u1EB1ng: 3Cu + 8HNO\u2083 \u2192 3Cu(NO\u2083)\u2082 + 2NO + 4H\u2082O => a + b = 3 + 8 = 11."},{id:"h10-b4-q3",type:"essay",prompt:"X\xE1c \u0111\u1ECBnh ch\u1EA5t kh\u1EED, ch\u1EA5t oxi h\xF3a v\xE0 c\xE2n b\u1EB1ng ph\u1EA3n \u1EE9ng: FeS\u2082 + O\u2082 \u2192 Fe\u2082O\u2083 + SO\u2082.",expectedKeywords:["fes2","o2","4","11","2","8"],sampleAnswer:"Ch\u1EA5t kh\u1EED: FeS\u2082; Ch\u1EA5t oxi h\xF3a: O\u2082. C\xE2n b\u1EB1ng: 4FeS\u2082 + 11O\u2082 \u2192 2Fe\u2082O\u2083 + 8SO\u2082.",explanation:"1 ph\xE2n t\u1EED FeS\u2082 nh\u01B0\u1EDDng 11e (Fe\u207A\xB2 -> Fe\u207A\xB3, 2S\u207B\xB9 -> 2S\u207A\u2074); 1 ph\xE2n t\u1EED O\u2082 nh\u1EADn 4e => nh\xE2n ch\xE9o 4 v\xE0 11."}]},{id:"h11-b1",grade:11,chapter:"Ch\u01B0\u01A1ng 1: C\xE2n b\u1EB1ng h\xF3a h\u1ECDc",title:"B\xE0i 1\u20133: C\xE2n b\u1EB1ng h\xF3a h\u1ECDc, \u0110i\u1EC7n li & pH c\u1EE7a dung d\u1ECBch",summary:"H\u1EB1ng s\u1ED1 c\xE2n b\u1EB1ng Kc ch\u1EC9 ph\u1EE5 thu\u1ED9c v\xE0o nhi\u1EC7t \u0111\u1ED9. Theo nguy\xEAn l\xFD Le Chatelier, h\u1EC7 s\u1EBD chuy\u1EC3n d\u1ECBch theo chi\u1EC1u ch\u1ED1ng l\u1EA1i t\xE1c \u0111\u1ED9ng b\xEAn ngo\xE0i (n\u1ED3ng \u0111\u1ED9, \xE1p su\u1EA5t, nhi\u1EC7t \u0111\u1ED9). Thuy\u1EBFt Br\xF8nsted-Lowry: Axit l\xE0 ch\u1EA5t cho H\u207A, Baz\u01A1 l\xE0 ch\u1EA5t nh\u1EADn H\u207A. pH = -lg[H\u207A].",keyFormulas:["pH = -lg[H\u207A]","[H\u207A]\xB7[OH\u207B] = 10\u207B\xB9\u2074 (25\xB0C)","pH + pOH = 14"],questions:[{id:"h11-b1-q1",type:"mcq",prompt:"Dung d\u1ECBch HCl c\xF3 n\u1ED3ng \u0111\u1ED9 0.01 M \u1EDF 25 \xB0C c\xF3 gi\xE1 tr\u1ECB pH b\u1EB1ng:",options:["1","2","12","13"],correctIndex:1,sampleAnswer:"2",explanation:"HCl l\xE0 axit m\u1EA1nh ph\xE2n li ho\xE0n to\xE0n: [H\u207A] = 0.01 = 10\u207B\xB2 M => pH = -lg(10\u207B\xB2) = 2."},{id:"h11-b1-q2",type:"mcq",prompt:"Cho c\xE2n b\u1EB1ng: N\u2082(g) + 3H\u2082(g) \u21CC 2NH\u2083(g), \u0394H < 0. \u0110\u1EC3 c\xE2n b\u1EB1ng chuy\u1EC3n d\u1ECBch theo chi\u1EC1u thu\u1EADn (t\u1EA1o th\xEAm NH\u2083), ta n\xEAn:",options:["Gi\u1EA3m \xE1p su\u1EA5t, t\u0103ng nhi\u1EC7t \u0111\u1ED9","T\u0103ng \xE1p su\u1EA5t, gi\u1EA3m nhi\u1EC7t \u0111\u1ED9 v\u1EEBa ph\u1EA3i","Th\xEAm ch\u1EA5t x\xFAc t\xE1c","L\u1EA5y b\u1EDBt H\u2082 ra"],correctIndex:1,sampleAnswer:"T\u0103ng \xE1p su\u1EA5t, gi\u1EA3m nhi\u1EC7t \u0111\u1ED9 v\u1EEBa ph\u1EA3i",explanation:"Chi\u1EC1u thu\u1EADn gi\u1EA3m s\u1ED1 mol kh\xED (4 -> 2) v\xE0 t\u1ECFa nhi\u1EC7t (\u0394H < 0), n\xEAn t\u0103ng \xE1p su\u1EA5t v\xE0 h\u1EA1 nhi\u1EC7t \u0111\u1ED9 gi\xFAp t\u0103ng hi\u1EC7u su\u1EA5t."},{id:"h11-b1-q3",type:"essay",prompt:"T\xEDnh pH c\u1EE7a dung d\u1ECBch Ba(OH)\u2082 0.005 M \u1EDF 25 \xB0C.",expectedKeywords:["0.01","poh = 2","12"],sampleAnswer:"Ba(OH)\u2082 \u2192 Ba\xB2\u207A + 2OH\u207B => [OH\u207B] = 2 \xD7 0.005 = 0.01 M = 10\u207B\xB2 M => pOH = 2 => pH = 14 - 2 = 12.",explanation:"Ba(OH)\u2082 \u0111i\u1EC7n li cho 2 ion OH\u207B tr\xEAn m\u1ED7i ph\xE2n t\u1EED."}]},{id:"h11-b2",grade:11,chapter:"Ch\u01B0\u01A1ng 2: Nitrogen \u2013 Sulfur",title:"B\xE0i 4\u20138: Nit\u01A1, Amoniac, Axit Nitric & L\u01B0u hu\u1EF3nh",summary:"N\u2082 r\u1EA5t b\u1EC1n \u1EDF nhi\u1EC7t \u0111\u1ED9 th\u01B0\u1EDDng do li\xEAn k\u1EBFt ba N\u2261N n\u0103ng l\u01B0\u1EE3ng l\u1EDBn (945 kJ/mol). NH\u2083 c\xF3 t\xEDnh baz\u01A1 y\u1EBFu v\xE0 t\xEDnh kh\u1EED. HNO\u2083 \u0111\u1EB7c/lo\xE3ng \u0111\u1EC1u c\xF3 t\xEDnh oxi h\xF3a m\u1EA1nh, kh\xF4ng sinh H\u2082 khi t\xE1c d\u1EE5ng kim lo\u1EA1i. H\u2082SO\u2084 \u0111\u1EB7c c\xF3 t\xEDnh h\xE1o n\u01B0\u1EDBc v\xE0 oxi h\xF3a m\u1EA1nh.",keyFormulas:["N\u2082 + 3H\u2082 \u21CC 2NH\u2083","Pha lo\xE3ng H\u2082SO\u2084 \u0111\u1EB7c: R\xF3t t\u1EEB t\u1EEB axit v\xE0o n\u01B0\u1EDBc"],questions:[{id:"h11-b2-q1",type:"mcq",prompt:"Kim lo\u1EA1i n\xE0o sau \u0111\xE2y b\u1ECB th\u1EE5 \u0111\u1ED9ng h\xF3a (kh\xF4ng ph\u1EA3n \u1EE9ng) trong dung d\u1ECBch HNO\u2083 \u0111\u1EB7c, ngu\u1ED9i?",options:["Cu v\xE0 Ag","Fe, Al, Cr","Zn v\xE0 Mg","Fe v\xE0 Cu"],correctIndex:1,sampleAnswer:"Fe, Al, Cr",explanation:"Fe, Al, Cr t\u1EA1o m\xE0ng oxit b\u1EC1n b\u1EA3o v\u1EC7 b\u1EC1 m\u1EB7t trong HNO\u2083 \u0111\u1EB7c ngu\u1ED9i v\xE0 H\u2082SO\u2084 \u0111\u1EB7c ngu\u1ED9i."},{id:"h11-b2-q2",type:"mcq",prompt:"\u0110\u1EC3 pha lo\xE3ng dung d\u1ECBch H\u2082SO\u2084 \u0111\u1EB7c an to\xE0n trong ph\xF2ng th\xED nghi\u1EC7m, c\u1EA7n th\u1EF1c hi\u1EC7n th\u1EBF n\xE0o?",options:["R\xF3t nhanh n\u01B0\u1EDBc v\xE0o axit","R\xF3t t\u1EEB t\u1EEB axit \u0111\u1EB7c v\xE0o n\u01B0\u1EDBc v\xE0 khu\u1EA5y \u0111\u1EC1u","\u0110\u1ED5 c\u1EA3 hai c\xF9ng l\xFAc","\u0110un n\xF3ng n\u01B0\u1EDBc tr\u01B0\u1EDBc r\u1ED3i \u0111\u1ED5 v\xE0o axit"],correctIndex:1,sampleAnswer:"R\xF3t t\u1EEB t\u1EEB axit \u0111\u1EB7c v\xE0o n\u01B0\u1EDBc v\xE0 khu\u1EA5y \u0111\u1EC1u",explanation:"H\u2082SO\u2084 \u0111\u1EB7c n\u1EB7ng h\u01A1n n\u01B0\u1EDBc v\xE0 t\u1ECFa nhi\u1EC7t c\u1EF1c l\u1EDBn khi tan; r\xF3t t\u1EEB t\u1EEB axit v\xE0o n\u01B0\u1EDBc gi\xFAp t\u1EA3n nhi\u1EC7t an to\xE0n."},{id:"h11-b2-q3
